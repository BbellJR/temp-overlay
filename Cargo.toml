[package]
name = "temp-overlay"
version = "0.1.0"
edition = "2021"
description = "Always-on-top overlay showing CPU / GPU / RAM / SSD temperatures"

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
